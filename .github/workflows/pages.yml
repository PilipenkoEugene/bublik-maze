# Собирает игру и публикует dist/ на GitHub Pages при каждом push в main.
# Адрес приёмника анкет берётся из переменной репозитория SUBMIT_URL
# (Settings → Secrets and variables → Actions → Variables). Без неё — демо-режим.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node build.mjs
        env:
          SUBMIT_URL: ${{ vars.SUBMIT_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
